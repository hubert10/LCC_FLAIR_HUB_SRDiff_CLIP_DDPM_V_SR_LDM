base_config:
  - ./diffsr_base.yaml
trainer_cls: tasks.srdiff.SRDiffTrainer

# model
unet_dim_mults: 1|2|4|8
decay_steps: 100000
hidden_size: 64
rrdb_num_feat: 64

# train and test
batch_size: 30
max_updates: 400000
eval_batch_size: 30
test_batch_size: 1
val_check_interval: 400000
save_ckpt_interval: 25000
test_diff: true
train_diffsr: true
max_s2_images: 8
use_highresnet_ltae: true
use_rrdb_ltae: false
misr_ref_image: closest
misr: true
sr_scale: 6.25
scale_factor: 0.1821

main_loss_weight: 1.0

px_loss_weight: 1.0
grad_px_loss_weight: 0.7
temp_grad_mag_loss_weight: 0.2
gray_value_px_loss_weight: 1.0

timesteps: 500
ddim_infer_steps: 20
use_ema: false

sd_weights: "/my_data/pretrain_weights/init_weight-sd.pt"
cond_net_ckpt: "/my_data/pretrain_weights/LCC_SITS_MaxViT_UPerNet_16/checkpoints/last.ckpt"
version: "/my_data/pretrain_weights/models--laion--CLIP-ViT-H-14-laion2B-s32B-b79K/snapshots/1c2b8495b28150b8a4922ee1c8edee224c284c0c/open_clip_pytorch_model.bin" # "laion2b_s32b_b79k",
diff_sat_weights: "/my_data/pretrain_weights/finetune_sd21_sn-satlas-fmow_snr5_md7norm_bs64"
